<!doctype html>
<html lang="pl">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5eee8">

<title>Nasze wspólne wspomnienia</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@400;500;600&display=swap');

:root{
  --bg:#f5eee8;
  --paper:#fffdfa;
  --ink:#3d3530;
  --muted:#8a7b70;
  --gold:#a88768;
  --line:#e5d8cd
}

*{
  box-sizing:border-box
}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at 10% 0,#fff 0,transparent 32%),
    radial-gradient(circle at 100% 100%,#e7dbd0 0,transparent 34%),
    var(--bg);
  color:var(--ink);
  font-family:Montserrat,system-ui,sans-serif
}

.wrap{
  max-width:720px;
  margin:auto;
  padding:24px 16px 40px
}

.card{
  background:rgba(255,253,250,.95);
  border:1px solid #a8876826;
  border-radius:30px;
  box-shadow:0 20px 70px #4d392611;
  overflow:hidden
}

.hero{
  text-align:center;
  padding:42px 24px 26px
}

.orn{
  font-size:25px;
  color:var(--gold);
  letter-spacing:9px
}

.eyebrow{
  text-transform:uppercase;
  letter-spacing:3px;
  font-size:10px;
  color:var(--muted);
  margin-top:12px
}

h1{
  font:500 clamp(45px,12vw,72px)/.88 "Cormorant Garamond",Georgia,serif;
  margin:16px 0 12px
}

.subtitle{
  font:400 22px/1.2 "Cormorant Garamond",Georgia,serif;
  color:var(--muted)
}

.rule{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:12px;
  color:var(--gold);
  margin:22px
}

.rule:before,
.rule:after{
  content:"";
  width:62px;
  height:1px;
  background:var(--line)
}

.content{
  padding:0 25px 32px
}

.drop{
  border:1.5px dashed #cbb7a7;
  border-radius:22px;
  background:#fffaf5;
  padding:26px 18px;
  text-align:center;
  transition:.2s
}

.drop.drag{
  background:#f2e8df;
  border-color:var(--gold)
}

.icon{
  font-size:34px
}

.drop strong{
  display:block;
  margin:9px 0 5px
}

.small{
  font-size:11px;
  line-height:1.65;
  color:var(--muted)
}

input{
  display:none
}

.choose{
  display:inline-block;
  margin-top:15px;
  padding:12px 20px;
  border-radius:999px;
  background:var(--ink);
  color:#fff;
  font-size:12px;
  font-weight:600;
  cursor:pointer
}

.list{
  margin-top:15px;
  display:grid;
  gap:7px
}

.file{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:9px 12px;
  background:#f7f1ec;
  border-radius:10px;
  font-size:11px
}

.file span:last-child{
  color:var(--muted);
  white-space:nowrap
}

button{
  font:600 12px Montserrat,sans-serif
}

.send{
  width:100%;
  margin-top:17px;
  padding:15px;
  border:0;
  border-radius:999px;
  background:var(--gold);
  color:#fff;
  cursor:pointer
}

.send:disabled{
  opacity:.5
}

.progress{
  height:7px;
  background:#eee5de;
  border-radius:99px;
  overflow:hidden;
  margin-top:18px
}

.bar{
  height:100%;
  width:0;
  background:var(--ink);
  transition:width .2s
}

.status{
  text-align:center;
  font-size:12px;
  margin-top:13px;
  min-height:18px
}

.ok{
  color:#507052
}

.err{
  color:#a24d4d
}

.gallery{
  margin-top:34px;
  padding-top:28px;
  border-top:1px solid var(--line)
}

.gallery h2{
  font:500 26px "Cormorant Garamond",Georgia,serif;
  text-align:center;
  margin:0 0 16px;
  color:var(--ink)
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(92px,1fr));
  gap:8px
}

.grid a{
  display:block;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 4px 14px #4d392622
}

.grid img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  display:block;
  background:#eee5de
}

.empty{
  grid-column:1/-1;
  text-align:center;
  color:var(--muted);
  font-size:12px;
  padding:14px 0
}

.footer{
  text-align:center;
  color:var(--muted);
  font-size:10px;
  margin-top:18px;
  line-height:1.6
}

</style>
</head>


<body>

<div class="wrap">

<main class="card">

<section class="hero">

<div class="orn">❦ ❦ ❦</div>

<div class="eyebrow">
  nasze wspólne wspomnienia
</div>

<h1>
  Wiola & Norbert
</h1>

<div class="subtitle">
  Dodaj swoje zdjęcia i filmy z tego wyjątkowego dnia
</div>

<div class="rule">
  ♡
</div>

</section>


<section class="content">


<div class="drop" id="drop">

<div class="icon">
  📷
</div>

<strong>
  Wybierz zdjęcia lub filmy
</strong>

<div class="small">
  Możesz dodać wiele plików naraz.<br>
  Jeden plik może mieć maksymalnie <b>50 MB</b>.
</div>

<label class="choose">
  Wybierz pliki
  <input
    id="files"
    type="file"
    accept="image/*,video/*"
    multiple
  >
</label>

<div class="list" id="list"></div>

</div>


<button class="send" id="send">
  Wyślij wspomnienia
</button>


<!-- POSTĘP AKTUALNEGO PLIKU -->

<div class="progress">
  <div
    class="bar"
    id="bar"
  ></div>
</div>


<!-- POSTĘP CAŁEGO UPLOADU -->

<div class="progress">
  <div
    class="bar"
    id="totalBar"
  ></div>
</div>


<div
  class="status"
  id="status"
></div>


<div class="gallery">

<h2>
  Ostatnie zdjęcia
</h2>

<div
  class="grid"
  id="gallery"
>
  <div class="empty">
    Ładowanie…
  </div>
</div>

</div>


</section>

</main>


<div class="footer">
  Dziękujemy, że tworzysz z nami tę pamiątkę ♡
</div>

</div>


<script>

/* ============================================================
   KONFIGURACJA
   ============================================================ */

const ENDPOINT =
  "https://script.google.com/macros/s/AKfycbwnwoJ95r2lJmI7PYf_2uJWPlgEOEjOl_UdJt-qnuI2YL5-k_l4t-n5kSFwITysDB_K/exec";


const MAX =
  50 * 1024 * 1024;


/*
 * Pliki <= 5 MB wysyłamy jednym requestem.
 *
 * Większe pliki wysyłamy fragmentami.
 */
const SMALL_FILE_LIMIT =
  5 * 1024 * 1024;


/*
 * Musi odpowiadać CHUNK_SIZE
 * w obecnym Code.gs.
 */
const CHUNK =
  8 * 1024 * 1024;


/* ============================================================
   ELEMENTY
   ============================================================ */

const filesEl =
  document.querySelector("#files");

const list =
  document.querySelector("#list");

const send =
  document.querySelector("#send");

const status =
  document.querySelector("#status");

const bar =
  document.querySelector("#bar");

const totalBar =
  document.querySelector("#totalBar");

const drop =
  document.querySelector("#drop");

const galleryEl =
  document.querySelector("#gallery");


/* ============================================================
   POMOCNICZE
   ============================================================ */

function fmt(n){

  return n < 1048576
    ? (n / 1024).toFixed(0) + " KB"
    : (n / 1048576).toFixed(1) + " MB";

}


function blobToBase64(blob){

  return new Promise((resolve,reject)=>{

    const reader =
      new FileReader();

    reader.onloadend = () => {

      resolve(
        reader.result.split(",")[1]
      );

    };

    reader.onerror =
      reject;

    reader.readAsDataURL(blob);

  });

}


function render(){

  list.innerHTML =
    [...filesEl.files]
      .map(f => `
        <div class="file">
          <span>${f.name}</span>
          <span>${fmt(f.size)}</span>
        </div>
      `)
      .join("");

}


filesEl.onchange =
  render;


/* ============================================================
   DRAG & DROP
   ============================================================ */

["dragenter","dragover"]
.forEach(x => {

  drop.addEventListener(
    x,
    e => {

      e.preventDefault();

      drop.classList.add("drag");

    }
  );

});


["dragleave","drop"]
.forEach(x => {

  drop.addEventListener(
    x,
    e => {

      e.preventDefault();

      drop.classList.remove("drag");

    }
  );

});


drop.addEventListener(
  "drop",
  e => {

    filesEl.files =
      e.dataTransfer.files;

    render();

  }
);


/* ============================================================
   REQUEST DO APPS SCRIPT
   ============================================================ */

async function call(payload){

  const r =
    await fetch(
      ENDPOINT,
      {
        method:"POST",

        headers:{
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body:
          JSON.stringify(payload)
      }
    );


  if(!r.ok){

    throw new Error(
      "Błąd serwera HTTP " +
      r.status
    );

  }


  return await r.json();

}


/* ============================================================
   UPLOAD MAŁEGO PLIKU
   ============================================================ */

async function uploadSmallFile(file){

  /*
   * Dla małego pliku przesyłamy całość
   * w jednym request.
   */

  const base64 =
    await blobToBase64(file);


  const result =
    await call({

      action:
        "smallUpload",

      name:
        file.name,

      mimeType:
        file.type ||
        "application/octet-stream",

      data:
        base64

    });


  if(!result.ok){

    throw new Error(
      result.error ||
      "Nie udało się wysłać pliku."
    );

  }


  /*
   * Plik zakończony.
   */

  bar.style.width =
    "100%";


  return true;

}


/* ============================================================
   UPLOAD DUŻEGO PLIKU
   ============================================================ */

async function uploadLargeFile(file){

  /*
   * Tworzymy sesję resumable
   * po stronie Apps Script / Google Drive.
   */

  const init =
    await call({

      action:
        "start",

      name:
        file.name,

      mimeType:
        file.type ||
        "application/octet-stream",

      size:
        file.size

    });


  if(
    !init.ok ||
    !init.session
  ){

    throw new Error(
      init.error ||
      "Nie udało się rozpocząć uploadu."
    );

  }


  const session =
    init.session;


  let offset =
    0;


  while(
    offset < file.size
  ){

    const end =
      Math.min(
        offset + CHUNK,
        file.size
      );


    const chunk =
      file.slice(
        offset,
        end
      );


    /*
     * Kodujemy tylko aktualny
     * fragment pliku.
     */

    const base64 =
      await blobToBase64(chunk);


    const result =
      await call({

        action:
          "chunk",

        session:
          session,

        offset:
          offset,

        total:
          file.size,

        data:
          base64

      });


    if(!result.ok){

      throw new Error(
        result.error ||
        `Błąd wysyłania fragmentu. Offset: ${offset}`
      );

    }


    offset =
      end;


    /*
     * POSTĘP AKTUALNEGO PLIKU
     */

    const percent =
      Math.round(
        offset /
        file.size *
        100
      );


    bar.style.width =
      percent + "%";

  }


  return true;

}


/* ============================================================
   UPLOAD JEDNEGO PLIKU
   ============================================================ */

async function uploadFile(file){

  if(
    file.size > MAX
  ){

    throw new Error(
      `${file.name} przekracza limit 50 MB.`
    );

  }


  /*
   * Mały plik.
   */

  if(
    file.size <=
    SMALL_FILE_LIMIT
  ){

    return await uploadSmallFile(
      file
    );

  }


  /*
   * Duży plik.
   */

  return await uploadLargeFile(
    file
  );

}


/* ============================================================
   GALERIA
   ============================================================ */

async function loadGallery(){

  try{

    const r =
      await fetch(
        `${ENDPOINT}?action=gallery`
      );


    const data =
      await r.json();


    if(!data.ok){

      throw new Error(
        data.error ||
        "Błąd pobierania galerii."
      );

    }


    if(
      !data.items.length
    ){

      galleryEl.innerHTML =
        '<div class="empty">Jeszcze nie ma tu zdjęć.</div>';

      return;

    }


    /*
     * Galeria pozostaje dokładnie
     * w formie z Twojego HTML.
     */

    galleryEl.innerHTML =
      data.items
        .map(f => {

          const thumb =
            `https://drive.google.com/thumbnail?id=${f.id}&sz=w400`;


          const full =
            `https://drive.google.com/file/d/${f.id}/view`;


          return `
            <a
              href="${full}"
              target="_blank"
              rel="noopener"
            >
              <img
                src="${thumb}"
                loading="lazy"
                alt=""
              >
            </a>
          `;

        })
        .join("");


  }catch(e){

    console.error(e);

    galleryEl.innerHTML =
      '<div class="empty">Nie udało się załadować galerii.</div>';

  }

}


/* ============================================================
   WYŚLIJ WSPOMNIENIA
   ============================================================ */

send.onclick =
  async () => {

    const files =
      [...filesEl.files];


    if(!files.length){

      status.textContent =
        "Wybierz przynajmniej jeden plik.";

      status.className =
        "status err";

      return;

    }


    /*
     * Sprawdzenie limitu.
     */

    const bad =
      files.find(
        f => f.size > MAX
      );


    if(bad){

      status.textContent =
        `${bad.name} jest większy niż dozwolony limit.`;

      status.className =
        "status err";

      return;

    }


    if(
      ENDPOINT.includes(
        "TWOJ_DEPLOYMENT_ID"
      )
    ){

      status.textContent =
        "Najpierw skonfiguruj adres Web App.";

      status.className =
        "status err";

      return;

    }


    send.disabled =
      true;


    /*
     * Łączny rozmiar wszystkich plików.
     *
     * Dzięki temu drugi pasek pokazuje
     * rzeczywisty procent całego uploadu,
     * a nie tylko liczbę ukończonych plików.
     */

    const totalBytes =
      files.reduce(
        (sum,file) =>
          sum + file.size,
        0
      );


    let uploadedBytes =
      0;


    /*
     * Zerujemy oba paski.
     */

    bar.style.width =
      "0%";

    totalBar.style.width =
      "0%";


    try{

      /*
       * Wysyłamy pliki jeden po drugim.
       */

      for(
        let i = 0;
        i < files.length;
        i++
      ){

        const file =
          files[i];


        /*
         * Informacja o aktualnym pliku.
         */

        status.textContent =
          `Wysyłanie ${i + 1} z ${files.length}: ${file.name}`;


        /*
         * Pasek aktualnego pliku
         * zaczyna od 0%.
         */

        bar.style.width =
          "0%";


        /*
         * Dla dużych plików potrzebujemy
         * aktualizować także pasek całkowity
         * podczas każdego chunka.
         *
         * Zapamiętujemy stan przed rozpoczęciem.
         */

        const fileStartBytes =
          uploadedBytes;


        /*
         * Mały plik.
         */

        if(
          file.size <=
          SMALL_FILE_LIMIT
        ){

          await uploadSmallFile(
            file
          );


          uploadedBytes +=
            file.size;


          bar.style.width =
            "100%";


          totalBar.style.width =
            Math.round(
              uploadedBytes /
              totalBytes *
              100
            ) + "%";

        }


        /*
         * Duży plik.
         */

        else{

          const init =
            await call({

              action:
                "start",

              name:
                file.name,

              mimeType:
                file.type ||
                "application/octet-stream",

              size:
                file.size

            });


          if(
            !init.ok ||
            !init.session
          ){

            throw new Error(
              init.error ||
              "Nie udało się rozpocząć uploadu."
            );

          }


          const session =
            init.session;


          let offset =
            0;


          while(
            offset < file.size
          ){

            const end =
              Math.min(
                offset + CHUNK,
                file.size
              );


            const chunk =
              file.slice(
                offset,
                end
              );


            const base64 =
              await blobToBase64(
                chunk
              );


            const result =
              await call({

                action:
                  "chunk",

                session:
                  session,

                offset:
                  offset,

                total:
                  file.size,

                data:
                  base64

              });


            if(!result.ok){

              throw new Error(
                result.error ||
                `Błąd wysyłania fragmentu. Offset: ${offset}`
              );

            }


            offset =
              end;


            /*
             * POSTĘP AKTUALNEGO PLIKU
             */

            const filePercent =
              Math.round(
                offset /
                file.size *
                100
              );


            bar.style.width =
              filePercent + "%";


            /*
             * POSTĘP CAŁOŚCI
             *
             * uploadedBytes zawiera
             * już ukończone pliki,
             * offset zawiera aktualny plik.
             */

            const overallPercent =
              Math.round(
                (
                  fileStartBytes +
                  offset
                ) /
                totalBytes *
                100
              );


            totalBar.style.width =
              overallPercent + "%";

          }


          /*
           * Plik ukończony.
           */

          uploadedBytes +=
            file.size;


          bar.style.width =
            "100%";


          totalBar.style.width =
            Math.round(
              uploadedBytes /
              totalBytes *
              100
            ) + "%";

        }

      }


      /*
       * Wszystkie pliki zakończone.
       */

      bar.style.width =
        "100%";

      totalBar.style.width =
        "100%";


      status.textContent =
        "Gotowe! Dziękujemy za piękne wspomnienia ❤️";

      status.className =
        "status ok";


      /*
       * Czyścimy wybór plików.
       */

      filesEl.value =
        "";

      list.innerHTML =
        "";


      /*
       * Odświeżamy galerię.
       */

      loadGallery();


    }catch(e){

      console.error(e);

      status.textContent =
        e.message ||
        "Wystąpił błąd podczas wysyłania.";

      status.className =
        "status err";

    }finally{

      send.disabled =
        false;

    }

  };


/* ============================================================
   START
   ============================================================ */

loadGallery();

</script>

</body>
</html>
