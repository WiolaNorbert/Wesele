<link

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;

  font-family:
    Montserrat,
    Arial,
    sans-serif;

  background:
    linear-gradient(
      180deg,
      #f8f1ec 0%,
      #fffaf7 100%
    );

  color: #463b36;
}

.container {
  width:
    min(900px, calc(100% - 32px));

  margin: 0 auto;

  padding:
    45px 0 60px;
}

.hero {
  text-align: center;
  margin-bottom: 35px;
}

.small-title {
  font-size: 12px;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: #8f7d73;
  margin-bottom: 12px;
}

h1 {
  font-family:
    "Cormorant Garamond",
    serif;

  font-size:
    clamp(52px, 10vw, 90px);

  line-height: .95;

  font-weight: 500;

  margin: 0;

  color: #59483f;
}

.subtitle {
  margin-top: 18px;

  font-family:
    "Cormorant Garamond",
    serif;

  font-size: 25px;

  color: #806d63;
}

.card {
  background:
    rgba(255,255,255,.82);

  border:

  border-radius: 24px;

  padding: 30px;

  box-shadow:
    0 12px 40px

  backdrop-filter: blur(8px);

  margin-bottom: 28px;
}

.upload-area {
  text-align: center;

  border:

  border-radius: 20px;

  padding: 35px 20px;

  transition:
    background .2s,
    border-color .2s;
}

.upload-area:hover {
  background: #fffaf7;
  border-color: #ad9588;
}

.upload-icon {
  font-size: 42px;
  margin-bottom: 12px;
}

.upload-title {
  font-family:
    "Cormorant Garamond",
    serif;

  font-size: 30px;

  margin-bottom: 8px;
}

.upload-description {
  font-size: 13px;

  line-height: 1.6;

  color: #8a7a72;

  margin-bottom: 22px;
}

input[type="file"] {
  display: none;
}

.select-button {
  display: inline-block;

  padding:
    13px 24px;

  border-radius: 30px;

  background: #806d63;

  color: white;

  cursor: pointer;

  font-size: 13px;

  font-weight: 600;

  letter-spacing: .5px;

  transition:
    transform .15s,
    background .15s;
}

.select-button:hover {
  background: #69574e;
  transform: translateY(-1px);
}

.files {
  margin-top: 25px;
}

.file {
  padding: 14px 0;

  border-bottom:
    1px solid

}

.file:last-child {
  border-bottom: 0;
}

.file-header {
  display: flex;

  justify-content:
    space-between;

  gap: 15px;

  font-size: 13px;

  margin-bottom: 8px;
}

.file-name {
  overflow: hidden;

  text-overflow: ellipsis;

  white-space: nowrap;
}

.file-status {
  white-space: nowrap;
  color: #8c7970;
}

.progress {
  width: 100%;
  height: 7px;

  background: #eee4de;

  border-radius: 20px;

  overflow: hidden;
}

.progress-bar {
  width: 0%;
  height: 100%;

  background: #9d887c;

  transition:
    width .15s linear;
}

.file-details {
  display: flex;

  justify-content:
    space-between;

  gap: 10px;

  margin-top: 7px;

  font-size: 11px;

  color: #998a82;
}

.total-progress {
  margin-top: 25px;

  padding-top: 20px;

  border-top:
    1px solid
    rgba(100,80,70,.1);
}

.total-title {
  display: flex;

  justify-content:
    space-between;

  font-size: 12px;

  margin-bottom: 8px;
}

.message {
  margin-top: 18px;

  text-align: center;

  font-size: 13px;

  line-height: 1.5;
}

.message.success {
  color: #637c66;
}

.message.error {
  color: #a15d57;
}

.gallery-title {
  text-align: center;

  font-family:
    "Cormorant Garamond",
    serif;

  font-size: 38px;

  font-weight: 500;

  margin:
    10px 0 25px;
}

.gallery {
  display: grid;

  grid-template-columns:
    repeat(
      auto-fill,
      minmax(180px, 1fr)
    );

  gap: 14px;
}

.gallery-item {
  position: relative;

  overflow: hidden;

  border-radius: 15px;

  background: #eee5df;

  aspect-ratio: 1 / 1;
}

.gallery-item img {
  width: 100%;
  height: 100%;

  display: block;

  object-fit: cover;
}

.gallery-empty {
  text-align: center;

  color: #97877f;

  font-size: 13px;

  padding: 25px;
}

.footer {
  text-align: center;

  margin-top: 35px;

  font-family:
    "Cormorant Garamond",
    serif;

  font-size: 19px;

  color: #96857b;
}

@media (max-width: 600px) {

  .container {
    width:
      calc(100% - 20px);

    padding-top: 30px;
  }

  .card {
    padding: 20px;
    border-radius: 18px;
  }

  .upload-area {
    padding: 28px 15px;
  }

  .file-header {
    font-size: 12px;
  }

  .gallery {
    grid-template-columns:
      repeat(2, 1fr);
  }
}

</style>

<body>

<div class="container">

  <section class="hero">

    <div class="small-title">
      Nasz wielki dzień
    </div>

    <h1>
      Wiola &amp; Norbert
    </h1>

    <div class="subtitle">
      Zapiszmy te wspomnienia razem ♡
    </div>

  </section>


  <section class="card">

    <div class="upload-area">

      <div class="upload-icon">
        📸
      </div>

      <div class="upload-title">
        Podziel się zdjęciami i filmami
      </div>

      <div class="upload-description">

        Dodaj swoje wspomnienia z naszego wesela.<br>

        Zdjęcia i filmy do
        <strong>50 MB</strong>
        każdy.

      </div>

      <label
        class="select-button"
        for="fileInput"
      >
        Wybierz zdjęcia lub filmy
      </label>

      <input
        id="fileInput"
        type="file"
        accept="image/*,video/*"
        multiple
      >

    </div>


    <div
      id="files"
      class="files"
    ></div>


    <div
      id="totalProgress"
      class="total-progress"
      style="display:none"
    >

      <div class="total-title">

        <span>
          Łączny postęp
        </span>

        <span id="totalPercent">
          0%
        </span>

      </div>

      <div class="progress">

        <div
          id="totalBar"
          class="progress-bar"
        ></div>

      </div>

    </div>


    <div
      id="message"
      class="message"
    ></div>

  </section>


  <section class="card">

    <div class="gallery-title">
      Najnowsze wspomnienia
    </div>

    <div
      id="gallery"
      class="gallery"
    >

      <div class="gallery-empty">
        Ładowanie zdjęć...
      </div>

    </div>

  </section>


  <div class="footer">
    Dziękujemy, że jesteście z nami ♡
  </div>

</div>


<script>

/*
 * ============================================================
 * KONFIGURACJA
 * ============================================================
 */

const ENDPOINT =
  "https://script.google.com/macros/s/AKfycbwnwoJ95r2lJmI7PYf_2uJWPlgEOEjOl_UdJt-qnuI2YL5-k_l4t-n5kSFwITysDB_K/exec";


const MAX_FILE_SIZE =
  50 * 1024 * 1024;


const SMALL_FILE_LIMIT =
  5 * 1024 * 1024;


const CHUNK_SIZE =
  8 * 1024 * 1024;


/*
 * ============================================================
 * ELEMENTY
 * ============================================================
 */

const fileInput =
  document.getElementById(
    "fileInput"
  );


const filesContainer =
  document.getElementById(
    "files"
  );


const message =
  document.getElementById(
    "message"
  );


const totalProgress =
  document.getElementById(
    "totalProgress"
  );


const totalBar =
  document.getElementById(
    "totalBar"
  );


const totalPercent =
  document.getElementById(
    "totalPercent"
  );


const gallery =
  document.getElementById(
    "gallery"
  );


/*
 * ============================================================
 * POMOCNICZE
 * ============================================================
 */

function formatBytes(bytes) {

  if (bytes < 1024) {
    return bytes + " B";
  }


  if (
    bytes <
    1024 * 1024
  ) {

    return (
      (bytes / 1024)
        .toFixed(0) +
      " KB"
    );
  }


  return (
    (bytes / 1024 / 1024)
      .toFixed(1) +
    " MB"
  );
}


function formatTime(seconds) {

  if (
    !Number.isFinite(seconds) ||
    seconds < 0
  ) {
    return "";
  }


  seconds =
    Math.round(seconds);


  if (seconds < 60) {
    return seconds + " s";
  }


  const minutes =
    Math.floor(
      seconds / 60
    );


  const secs =
    seconds % 60;


  return (
    minutes +
    " min " +
    String(secs)
      .padStart(2, "0") +
    " s"
  );
}


function escapeHtml(value) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );
}


/*
 * ============================================================
 * APPS SCRIPT
 * ============================================================
 *
 * Do Apps Script wysyłamy tylko JSON.
 *
 * Content-Type text/plain jest celowy:
 * pozwala uniknąć dodatkowego CORS preflight.
 */

async function callBackend(payload) {

  const response =
    await fetch(
      ENDPOINT,
      {

        method: "POST",

        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body:
          JSON.stringify(payload)

      }
    );


  const text =
    await response.text();


  let data;


  try {

    data =
      JSON.parse(text);

  } catch (err) {

    throw new Error(
      "Nieprawidłowa odpowiedź serwera: " +
      text
    );
  }


  if (!data.ok) {

    throw new Error(
      data.error ||
      "Nieznany błąd serwera."
    );
  }


  return data;
}


/*
 * ============================================================
 * ARRAY BUFFER → BASE64
 * ============================================================
 *
 * Nie używamy:
 *
 *   btoa(String.fromCharCode(...bytes))
 *
 * dla całego chunka naraz, bo 8 MB mogłoby
 * spowodować problemy ze stosem / argumentami funkcji.
 */

function arrayBufferToBase64(buffer) {

  const bytes =
    new Uint8Array(buffer);


  const chunk =
    0x8000;


  let binary = "";


  for (
    let i = 0;
    i < bytes.length;
    i += chunk
  ) {

    const part =
      bytes.subarray(
        i,
        Math.min(
          i + chunk,
          bytes.length
        )
      );


    binary +=
      String.fromCharCode(
        ...part
      );
  }


  return btoa(binary);
}


/*
 * ============================================================
 * MAŁY PLIK
 * ============================================================
 */

async function uploadSmallFile(
  file,
  ui
) {

  ui.status.textContent =
    "przygotowanie";


  /*
   * Czytamy plik jako ArrayBuffer.
   */
  const buffer =
    await file.arrayBuffer();


  /*
   * Base64 tylko dla małego pliku.
   */
  const base64 =
    arrayBufferToBase64(
      buffer
    );


  ui.status.textContent =
    "wysyłanie";


  const startTime =
    performance.now();


  const result =
    await callBackend({

      action:
        "smallUpload",

      name:
        file.name,

      mimeType:
        file.type ||
        "application/octet-stream",

      data:
        base64

    });


  const elapsed =
    Math.max(
      (performance.now() -
        startTime) /
      1000,
      0.001
    );


  const speed =
    file.size /
    elapsed;


  ui.bar.style.width =
    "100%";


  ui.status.textContent =
    "gotowe";


  ui.details.textContent =
    formatBytes(file.size) +
    " / " +
    formatBytes(file.size) +
    "    " +
    formatBytes(speed) +
    "/s";


  return result;
}


/*
 * ============================================================
 * DUŻY PLIK
 * ============================================================
 */

async function uploadLargeFile(
  file,
  ui,
  totalState
) {

  /*
   * 1. Tworzymy sesję.
   *
   * Do Apps Script wysyłamy tylko metadane.
   */
  const sessionData =
    await callBackend({

      action:
        "start",

      name:
        file.name,

      mimeType:
        file.type ||
        "application/octet-stream",

      size:
        file.size

    });


  const session =
    sessionData.session;


  if (!session) {

    throw new Error(
      "Brak URL sesji uploadu."
    );
  }


  let offset = 0;


  const startTime =
    performance.now();


  /*
   * 2. Kolejne chunki.
   */
  while (
    offset <
    file.size
  ) {

    const end =
      Math.min(
        offset +
          CHUNK_SIZE,
        file.size
      );


    /*
     * Pobieramy tylko aktualny chunk.
     */
    const blob =
      file.slice(
        offset,
        end
      );


    /*
     * Blob → ArrayBuffer.
     */
    const buffer =
      await blob.arrayBuffer();


    /*
     * ArrayBuffer → Base64.
     */
    const base64 =
      arrayBufferToBase64(
        buffer
      );


    /*
     * 3. Chunk idzie do Apps Script.
     *
     * Apps Script dekoduje go i przesyła
     * binarnie do Google Drive.
     */
    const result =
      await callBackend({

        action:
          "chunk",

        session:
          session,

        offset:
          offset,

        total:
          file.size,

        data:
          base64

      });


    /*
     * Serwer zwraca faktycznie przyjęty
     * zakres bajtów.
     */
    offset =
      Number(
        result.uploaded
      );


    if (
      !Number.isFinite(offset)
    ) {

      throw new Error(
        "Google Drive zwrócił nieprawidłowy postęp uploadu."
      );
    }


    /*
     * Postęp pliku.
     */
    const elapsed =
      Math.max(
        (performance.now() -
          startTime) /
        1000,
        0.001
      );


    const speed =
      offset /
      elapsed;


    const remaining =
      file.size -
      offset;


    const eta =
      speed > 0
        ? remaining / speed
        : 0;


    const percent =
      file.size > 0
        ? offset /
          file.size *
          100
        : 100;


    ui.bar.style.width =
      percent.toFixed(1) +
      "%";


    ui.status.textContent =
      percent >= 100
        ? "gotowe"
        : "wysyłanie";


    ui.details.textContent =
      formatBytes(offset) +
      " / " +
      formatBytes(file.size) +
      "    " +
      formatBytes(speed) +
      "/s" +
      (
        remaining > 0
          ? "    pozostało " +
            formatTime(eta)
          : ""
      );


    /*
     * Łączny postęp.
     */
    totalState.uploaded =
      totalState.baseUploaded +
      offset;


    updateTotalProgress(
      totalState.allFiles,
      totalState.totalSize
    );
  }


  /*
   * Koniec pliku.
   */
  ui.bar.style.width =
    "100%";

  ui.status.textContent =
    "gotowe";


  totalState.uploaded =
    totalState.baseUploaded +
    file.size;


  updateTotalProgress(
    totalState.allFiles,
    totalState.totalSize
  );
}


/*
 * ============================================================
 * UPLOAD PLIKU
 * ============================================================
 */

async function uploadFile(
  file,
  ui,
  totalState
) {

  if (
    file.size >
    MAX_FILE_SIZE
  ) {

    throw new Error(
      "Plik \"" +
      file.name +
      "\" jest za duży. " +
      "Maksymalny rozmiar to 50 MB."
    );
  }


  /*
   * Mały plik:
   *
   * 1 request.
   */
  if (
    file.size <=
    SMALL_FILE_LIMIT
  ) {

    const result =
      await uploadSmallFile(
        file,
        ui
      );


    totalState.baseUploaded +=
      file.size;


    totalState.uploaded =
      totalState.baseUploaded;


    updateTotalProgress(
      totalState.allFiles,
      totalState.totalSize
    );


    return result;
  }


  /*
   * Duży plik:
   *
   * resumable upload.
   */
  return uploadLargeFile(
    file,
    ui,
    totalState
  );
}


/*
 * ============================================================
 * UI PLIKU
 * ============================================================
 */

function createFileUI(file) {

  const wrapper =
    document.createElement(
      "div"
    );


  wrapper.className =
    "file";


  wrapper.innerHTML = `

    <div class="file-header">

      <span class="file-name">
        ${escapeHtml(file.name)}
      </span>

      <span class="file-status">
        oczekiwanie
      </span>

    </div>

    <div class="progress">

      <div
        class="progress-bar"
        style="width:0%"
      ></div>

    </div>

    <div class="file-details">
      0 KB / ${formatBytes(file.size)}
    </div>

  `;


  filesContainer.appendChild(
    wrapper
  );


  return {

    bar:
      wrapper.querySelector(
        ".progress-bar"
      ),

    status:
      wrapper.querySelector(
        ".file-status"
      ),

    details:
      wrapper.querySelector(
        ".file-details"
      )

  };
}


/*
 * ============================================================
 * ŁĄCZNY POSTĘP
 * ============================================================
 */

function updateTotalProgress(
  allFiles,
  totalSize
) {

  let uploaded = 0;


  for (
    const item
    of allFiles
  ) {

    uploaded +=
      item.uploaded || 0;
  }


  const percent =
    totalSize > 0
      ? uploaded /
        totalSize *
        100
      : 0;


  totalBar.style.width =
    percent.toFixed(1) +
    "%";


  totalPercent.textContent =
    Math.round(percent) +
    "%";
}


/*
 * ============================================================
 * WYBÓR PLIKÓW
 * ============================================================
 */

fileInput.addEventListener(
  "change",
  async function() {

    const selected =
      Array.from(
        fileInput.files || []
      );


    if (!selected.length) {
      return;
    }


    filesContainer.innerHTML =
      "";


    message.textContent =
      "";


    message.className =
      "message";


    /*
     * Sprawdzamy wszystkie pliki
     * przed rozpoczęciem uploadu.
     */
    for (
      const file
      of selected
    ) {

      if (
        file.size >
        MAX_FILE_SIZE
      ) {

        message.textContent =
          "Plik \"" +
          file.name +
          "\" jest za duży. " +
          "Maksymalny rozmiar to 50 MB.";

        message.className =
          "message error";

        return;
      }
    }


    const allFiles =
      selected.map(
        function(file) {

          return {
            file:
              file,

            uploaded:
              0,

            ui:
              createFileUI(file)

          };
        }
      );


    const totalSize =
      selected.reduce(
        function(sum, file) {
          return sum +
            file.size;
        },
        0
      );


    const totalState = {

      allFiles:
        allFiles,

      totalSize:
        totalSize,

      baseUploaded:
        0,

      uploaded:
        0

    };


    totalProgress.style.display =
      "block";


    updateTotalProgress(
      allFiles,
      totalSize
    );


    try {

      /*
       * Uploadujemy sekwencyjnie.
       *
       * Nie uruchamiamy np. 5 dużych filmów
       * jednocześnie, bo zwiększyłoby to
       * obciążenie Apps Script.
       */
      for (
        const item
        of allFiles
      ) {

        item.ui.status.textContent =
          "przygotowanie";


        await uploadFile(
          item.file,
          item.ui,
          totalState
        );


        item.uploaded =
          item.file.size;


        totalState.baseUploaded =
          allFiles
            .slice(
              0,
              allFiles.indexOf(item) + 1
            )
            .reduce(
              function(sum, x) {
                return sum +
                  x.file.size;
              },
              0
            );


        totalState.uploaded =
          totalState.baseUploaded;


        updateTotalProgress(
          allFiles,
          totalSize
        );
      }


      message.textContent =
        "Wszystkie pliki zostały przesłane. Dziękujemy! ♡";


      message.className =
        "message success";


      /*
       * Po zakończeniu uploadu odświeżamy galerię.
       */
      await loadGallery();


    } catch (err) {

      console.error(
        "UPLOAD ERROR:",
        err
      );


      message.textContent =
        "Wystąpił błąd: " +
        (
          err &&
          err.message
            ? err.message
            : err
        );


      message.className =
        "message error";
    }

  }
);


/*
 * ============================================================
 * GALERIA
 * ============================================================
 */

async function loadGallery() {

  try {

    const response =
      await fetch(
        ENDPOINT +
        "?action=gallery"
      );


    const data =
      await response.json();


    if (!data.ok) {

      throw new Error(
        data.error ||
        "Nie udało się pobrać galerii."
      );
    }


    const items =
      data.items || [];


    if (!items.length) {

      gallery.innerHTML = `

        <div class="gallery-empty">
          Zdjęcia pojawią się tutaj po przesłaniu.
        </div>

      `;

      return;
    }


    gallery.innerHTML =
      items
        .map(
          function(item) {

            return `

              <div class="gallery-item">

                <img
                  src="https://drive.google.com/thumbnail?id=${encodeURIComponent(item.id)}&sz=w1000"
                  alt="${escapeHtml(item.name)}"
                  loading="lazy"
                >

              </div>

            `;

          }
        )
        .join("");


  } catch (err) {

    console.error(
      "Gallery error:",
      err
    );


    gallery.innerHTML = `

      <div class="gallery-empty">
        Nie udało się załadować galerii.
      </div>

    `;
  }
}


/*
 * ============================================================
 * START
 * ============================================================
 */

loadGallery();

</script>

</body>

</html>
