<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5eee8">

<title>Nasze wspólne wspomnienia</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@400;500;600&display=swap');

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background:
    linear-gradient(180deg, #f8f1ec 0%, #fffaf7 100%);
  color: #463b36;
  font-family: Montserrat, Arial, sans-serif;
}

.container {
  max-width: 900px;
  margin: 0 auto;
  padding: 45px 20px 60px;
}

.hero {
  text-align: center;
  margin-bottom: 35px;
}

.small-title {
  font-size: 12px;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: #8f7d73;
  margin-bottom: 12px;
}

h1 {
  font-family: "Cormorant Garamond", serif;
  font-size: clamp(52px, 10vw, 90px);
  line-height: .95;
  font-weight: 500;
  margin: 0;
  color: #59483f;
}

.subtitle {
  margin-top: 18px;
  font-family: "Cormorant Garamond", serif;
  font-size: 25px;
  color: #806d63;
}

.card {
  background: rgba(255,255,255,.82);
  border: 1px solid rgba(130,100,80,.14);
  border-radius: 24px;
  padding: 30px;
  box-shadow: 0 12px 40px rgba(80,55,40,.08);
  backdrop-filter: blur(8px);
  margin-bottom: 28px;
}

.upload-area {
  text-align: center;
  border: 2px dashed #cdbdb3;
  border-radius: 20px;
  padding: 35px 20px;
  transition: background .2s, border-color .2s;
}

.upload-area:hover {
  background: #fffaf7;
  border-color: #ad9588;
}

.upload-icon {
  font-size: 42px;
  margin-bottom: 12px;
}

.upload-title {
  font-family: "Cormorant Garamond", serif;
  font-size: 30px;
  margin-bottom: 8px;
}

.upload-description {
  font-size: 13px;
  line-height: 1.6;
  color: #8a7a72;
  margin-bottom: 22px;
}

input[type="file"] {
  display: none;
}

.select-button {
  display: inline-block;
  padding: 13px 24px;
  border-radius: 30px;
  background: #806d63;
  color: white;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: .5px;
  transition: transform .15s, background .15s;
}

.select-button:hover {
  background: #69574e;
  transform: translateY(-1px);
}

.files {
  margin-top: 25px;
}

.file {
  padding: 14px 0;
  border-bottom: 1px solid rgba(100,80,70,.1);
}

.file:last-child {
  border-bottom: 0;
}

.file-header {
  display: flex;
  justify-content: space-between;
  gap: 15px;
  font-size: 13px;
  margin-bottom: 8px;
}

.file-name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.file-status {
  white-space: nowrap;
  color: #8c7970;
}

.progress {
  width: 100%;
  height: 7px;
  background: #eee4de;
  border-radius: 20px;
  overflow: hidden;
}

.progress-bar {
  width: 0%;
  height: 100%;
  background: #9d887c;
  transition: width .15s linear;
}

.file-details {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-top: 7px;
  font-size: 11px;
  color: #998a82;
}

.total-progress {
  margin-top: 25px;
  padding-top: 20px;
  border-top: 1px solid rgba(100,80,70,.1);
}

.total-title {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  margin-bottom: 8px;
}

.message {
  margin-top: 18px;
  text-align: center;
  font-size: 13px;
  line-height: 1.5;
}

.message.success {
  color: #637c66;
}

.message.error {
  color: #a15d57;
}

.gallery-title {
  text-align: center;
  font-family: "Cormorant Garamond", serif;
  font-size: 38px;
  font-weight: 500;
  margin: 10px 0 25px;
}

.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 14px;
}

.gallery-item {
  position: relative;
  overflow: hidden;
  border-radius: 15px;
  background: #eee5df;
  aspect-ratio: 1 / 1;
  cursor: pointer;
}

.gallery-item img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
  transition: transform .25s ease;
}

.gallery-item:hover img {
  transform: scale(1.04);
}

.gallery-empty {
  text-align: center;
  color: #97877f;
  font-size: 13px;
  padding: 25px;
}

/*
 * Podgląd zdjęcia
 */
.lightbox {
  display: none;
  position: fixed;
  z-index: 9999;
  inset: 0;
  background: rgba(30, 22, 18, .88);
  align-items: center;
  justify-content: center;
  padding: 20px;
  cursor: zoom-out;
}

.lightbox.show {
  display: flex;
}

.lightbox img {
  max-width: 95vw;
  max-height: 92vh;
  object-fit: contain;
  border-radius: 8px;
  box-shadow: 0 15px 60px rgba(0,0,0,.4);
}

.lightbox-close {
  position: fixed;
  top: 18px;
  right: 24px;
  color: white;
  font-size: 36px;
  line-height: 1;
  cursor: pointer;
  font-family: Arial, sans-serif;
}

.footer {
  text-align: center;
  margin-top: 35px;
  font-family: "Cormorant Garamond", serif;
  font-size: 19px;
  color: #96857b;
}

@media (max-width: 600px) {

  .container {
    padding-top: 30px;
  }

  .card {
    padding: 20px;
    border-radius: 18px;
  }

  .upload-area {
    padding: 28px 15px;
  }

  .file-header {
    font-size: 12px;
  }

  .gallery {
    grid-template-columns: repeat(2, 1fr);
  }
}
</style>
</head>

<body>

<div class="container">

  <section class="hero">

    <div class="small-title">
      Nasz wielki dzień
    </div>

    <h1>
      Wiola &amp; Norbert
    </h1>

    <div class="subtitle">
      Zapiszmy te wspomnienia razem ♡
    </div>

  </section>


  <section class="card">

    <div class="upload-area">

      <div class="upload-icon">
        📸
      </div>

      <div class="upload-title">
        Podziel się zdjęciami i filmami
      </div>

      <div class="upload-description">
        Dodaj swoje wspomnienia z naszego wesela.<br>
        Zdjęcia i filmy do <strong>50 MB</strong> każdy.
      </div>

      <label
        class="select-button"
        for="fileInput"
      >
        Wybierz zdjęcia lub filmy
      </label>

      <input
        id="fileInput"
        type="file"
        accept="image/*,video/*"
        multiple
      >

    </div>


    <div
      id="files"
      class="files"
    ></div>


    <div
      id="totalProgress"
      class="total-progress"
      style="display:none"
    >

      <div class="total-title">

        <span>
          Łączny postęp
        </span>

        <span id="totalPercent">
          0%
        </span>

      </div>

      <div class="progress">

        <div
          id="totalBar"
          class="progress-bar"
        ></div>

      </div>

    </div>


    <div
      id="message"
      class="message"
    ></div>

  </section>


  <section class="card">

    <div class="gallery-title">
      Najnowsze wspomnienia
    </div>

    <div
      id="gallery"
      class="gallery"
    >
      <div class="gallery-empty">
        Ładowanie zdjęć...
      </div>
    </div>

  </section>


  <div class="footer">
    Dziękujemy, że jesteście z nami ♡
  </div>

</div>


<!-- Podgląd pełnego zdjęcia -->

<div
  id="lightbox"
  class="lightbox"
>

  <div
    id="lightboxClose"
    class="lightbox-close"
  >
    ×
  </div>

  <img
    id="lightboxImage"
    src=""
    alt=""
  >

</div>


<script>

/*
 * ============================================================
 * KONFIGURACJA
 * ============================================================
 */

const ENDPOINT =
  "https://script.google.com/macros/s/AKfycbwnwoJ95r2lJmI7PYf_2uJWPlgEOEjOl_UdJt-qnuI2YL5-k_l4t-n5kSFwITysDB_K/exec";


const MAX_FILE_SIZE =
  50 * 1024 * 1024;


const SMALL_FILE_LIMIT =
  5 * 1024 * 1024;


const CHUNK_SIZE =
  8 * 1024 * 1024;


/*
 * ============================================================
 * ELEMENTY
 * ============================================================
 */

const fileInput =
  document.getElementById("fileInput");

const filesContainer =
  document.getElementById("files");

const message =
  document.getElementById("message");

const totalProgress =
  document.getElementById("totalProgress");

const totalBar =
  document.getElementById("totalBar");

const totalPercent =
  document.getElementById("totalPercent");

const gallery =
  document.getElementById("gallery");

const lightbox =
  document.getElementById("lightbox");

const lightboxImage =
  document.getElementById("lightboxImage");

const lightboxClose =
  document.getElementById("lightboxClose");


/*
 * ============================================================
 * POMOCNICZE
 * ============================================================
 */

function formatBytes(bytes) {

  if (bytes < 1024) {
    return bytes + " B";
  }

  if (bytes < 1024 * 1024) {
    return (
      (bytes / 1024).toFixed(0) +
      " KB"
    );
  }

  return (
    (bytes / 1024 / 1024).toFixed(1) +
    " MB"
  );
}


function formatTime(seconds) {

  if (
    !Number.isFinite(seconds) ||
    seconds < 0
  ) {
    return "";
  }

  seconds = Math.round(seconds);

  if (seconds < 60) {
    return seconds + " s";
  }

  const minutes =
    Math.floor(seconds / 60);

  const secs =
    seconds % 60;

  return (
    minutes +
    " min " +
    String(secs).padStart(2, "0") +
    " s"
  );
}


function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/*
 * ============================================================
 * APPS SCRIPT
 * ============================================================
 */

async function callBackend(payload) {

  const response =
    await fetch(
      ENDPOINT,
      {
        method: "POST",

        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body:
          JSON.stringify(payload)
      }
    );


  const text =
    await response.text();


  let data;

  try {

    data =
      JSON.parse(text);

  } catch (err) {

    throw new Error(
      "Nieprawidłowa odpowiedź serwera: " +
      text
    );
  }


  if (!data.ok) {

    throw new Error(
      data.error ||
      "Nieznany błąd serwera."
    );
  }


  return data;
}


/*
 * ============================================================
 * ARRAYBUFFER → BASE64
 * ============================================================
 */

function arrayBufferToBase64(buffer) {

  const bytes =
    new Uint8Array(buffer);

  const CHUNK =
    0x8000;

  let binary = "";

  for (
    let i = 0;
    i < bytes.length;
    i += CHUNK
  ) {

    const part =
      bytes.subarray(
        i,
        Math.min(
          i + CHUNK,
          bytes.length
        )
      );

    binary +=
      String.fromCharCode(...part);
  }

  return btoa(binary);
}


/*
 * ============================================================
 * MAŁY PLIK
 * ============================================================
 */

async function uploadSmallFile(
  file,
  ui,
  totalState
) {

  ui.status.textContent =
    "wysyłanie";


  const startTime =
    performance.now();


  const buffer =
    await file.arrayBuffer();


  const base64 =
    arrayBufferToBase64(
      buffer
    );


  await callBackend({

    action:
      "smallUpload",

    name:
      file.name,

    mimeType:
      file.type ||
      "application/octet-stream",

    data:
      base64

  });


  const elapsed =
    Math.max(
      (performance.now() -
        startTime) / 1000,
      .001
    );


  const speed =
    file.size / elapsed;


  ui.bar.style.width =
    "100%";

  ui.status.textContent =
    "gotowe";

  ui.details.textContent =
    formatBytes(file.size) +
    " / " +
    formatBytes(file.size) +
    "    " +
    formatBytes(speed) +
    "/s";


  totalState.uploaded +=
    file.size;

  updateTotalProgress(
    totalState
  );
}


/*
 * ============================================================
 * DUŻY PLIK
 * ============================================================
 */

async function uploadLargeFile(
  file,
  ui,
  totalState
) {

  /*
   * Najpierw tylko metadane.
   */
  const sessionData =
    await callBackend({

      action:
        "start",

      name:
        file.name,

      mimeType:
        file.type ||
        "application/octet-stream",

      size:
        file.size

    });


  const session =
    sessionData.session;


  if (!session) {

    throw new Error(
      "Brak URL sesji uploadu."
    );
  }


  let offset = 0;

  const startTime =
    performance.now();


  while (
    offset < file.size
  ) {

    const end =
      Math.min(
        offset + CHUNK_SIZE,
        file.size
      );


    const blob =
      file.slice(
        offset,
        end
      );


    const buffer =
      await blob.arrayBuffer();


    const base64 =
      arrayBufferToBase64(
        buffer
      );


    const result =
      await callBackend({

        action:
          "chunk",

        session:
          session,

        offset:
          offset,

        total:
          file.size,

        data:
          base64

      });


    offset =
      Number(
        result.uploaded
      );


    if (
      !Number.isFinite(offset)
    ) {

      throw new Error(
        "Nieprawidłowy postęp uploadu."
      );
    }


    const elapsed =
      Math.max(
        (performance.now() -
          startTime) / 1000,
        .001
      );


    const speed =
      offset / elapsed;


    const remaining =
      file.size - offset;


    const eta =
      speed > 0
        ? remaining / speed
        : 0;


    const percent =
      file.size > 0
        ? offset / file.size * 100
        : 100;


    ui.bar.style.width =
      percent.toFixed(1) +
      "%";


    ui.status.textContent =
      percent >= 100
        ? "gotowe"
        : "wysyłanie";


    ui.details.textContent =
      formatBytes(offset) +
      " / " +
      formatBytes(file.size) +
      "    " +
      formatBytes(speed) +
      "/s" +
      (
        remaining > 0
          ? "    pozostało " +
            formatTime(eta)
          : ""
      );


    totalState.uploaded =
      totalState.baseUploaded +
      offset;


    updateTotalProgress(
      totalState
    );
  }


  totalState.baseUploaded +=
    file.size;

  totalState.uploaded =
    totalState.baseUploaded;


  updateTotalProgress(
    totalState
  );
}


/*
 * ============================================================
 * UPLOAD PLIKU
 * ============================================================
 */

async function uploadFile(
  file,
  ui,
  totalState
) {

  if (
    file.size >
    MAX_FILE_SIZE
  ) {

    throw new Error(
      "Plik \"" +
      file.name +
      "\" jest za duży. " +
      "Maksymalny rozmiar to 50 MB."
    );
  }


  if (
    file.size <=
    SMALL_FILE_LIMIT
  ) {

    await uploadSmallFile(
      file,
      ui,
      totalState
    );

    return;
  }


  await uploadLargeFile(
    file,
    ui,
    totalState
  );
}


/*
 * ============================================================
 * UI PLIKU
 * ============================================================
 */

function createFileUI(file) {

  const wrapper =
    document.createElement("div");

  wrapper.className =
    "file";


  wrapper.innerHTML = `

    <div class="file-header">

      <span class="file-name">
        ${escapeHtml(file.name)}
      </span>

      <span class="file-status">
        oczekiwanie
      </span>

    </div>

    <div class="progress">

      <div
        class="progress-bar"
        style="width:0%"
      ></div>

    </div>

    <div class="file-details">
      0 KB / ${formatBytes(file.size)}
    </div>

  `;


  filesContainer.appendChild(
    wrapper
  );


  return {

    bar:
      wrapper.querySelector(
        ".progress-bar"
      ),

    status:
      wrapper.querySelector(
        ".file-status"
      ),

    details:
      wrapper.querySelector(
        ".file-details"
      )

  };
}


/*
 * ============================================================
 * ŁĄCZNY POSTĘP
 * ============================================================
 */

function updateTotalProgress(
  totalState
) {

  const percent =
    totalState.totalSize > 0
      ? totalState.uploaded /
        totalState.totalSize *
        100
      : 0;


  totalBar.style.width =
    percent.toFixed(1) +
    "%";


  totalPercent.textContent =
    Math.round(percent) +
    "%";
}


/*
 * ============================================================
 * WYBÓR PLIKÓW
 * ============================================================
 */

fileInput.addEventListener(
  "change",
  async function() {

    const selected =
      Array.from(
        fileInput.files || []
      );


    if (!selected.length) {
      return;
    }


    filesContainer.innerHTML =
      "";


    message.textContent =
      "";


    message.className =
      "message";


    for (
      const file
      of selected
    ) {

      if (
        file.size >
        MAX_FILE_SIZE
      ) {

        message.textContent =
          "Plik \"" +
          file.name +
          "\" jest za duży. " +
          "Maksymalny rozmiar to 50 MB.";

        message.className =
          "message error";

        return;
      }
    }


    const allFiles =
      selected.map(
        function(file) {

          return {

            file:
              file,

            uploaded:
              0,

            ui:
              createFileUI(file)

          };

        }
      );


    const totalSize =
      selected.reduce(
        function(sum, file) {

          return sum +
            file.size;

        },
        0
      );


    const totalState = {

      allFiles:
        allFiles,

      totalSize:
        totalSize,

      uploaded:
        0,

      baseUploaded:
        0

    };


    totalProgress.style.display =
      "block";


    updateTotalProgress(
      totalState
    );


    try {

      /*
       * Uploadujemy po kolei.
       */
      for (
        const item
        of allFiles
      ) {

        item.ui.status.textContent =
          "przygotowanie";


        await uploadFile(
          item.file,
          item.ui,
          totalState
        );


        item.uploaded =
          item.file.size;
      }


      message.textContent =
        "Wszystkie pliki zostały przesłane. Dziękujemy! ♡";


      message.className =
        "message success";


      await loadGallery();


    } catch (err) {

      console.error(
        "UPLOAD ERROR:",
        err
      );


      message.textContent =
        "Wystąpił błąd: " +
        (
          err &&
          err.message
            ? err.message
            : err
        );


      message.className =
        "message error";
    }

  }
);


/*
 * ============================================================
 * GALERIA
 * ============================================================
 */

async function loadGallery() {

  try {

    const response =
      await fetch(
        ENDPOINT +
        "?action=gallery"
      );


    const data =
      await response.json();


    if (!data.ok) {

      throw new Error(
        data.error ||
        "Nie udało się pobrać galerii."
      );
    }


    const items =
      data.items || [];


    if (!items.length) {

      gallery.innerHTML = `

        <div class="gallery-empty">
          Zdjęcia pojawią się tutaj po przesłaniu.
        </div>

      `;

      return;
    }


    gallery.innerHTML =
      items.map(
        function(item) {

          /*
           * Kliknięcie zdjęcia otwiera je
           * w pełnym rozmiarze.
           */
          const fullUrl =
            "https://drive.google.com/uc?export=view&id=" +
            encodeURIComponent(item.id);


          const thumbUrl =
            "https://drive.google.com/thumbnail?id=" +
            encodeURIComponent(item.id) +
            "&sz=w1000";


          return `

            <div
              class="gallery-item"
              onclick="openLightbox('${fullUrl}', '${escapeHtml(item.name)}')"
            >

              <img
                src="${thumbUrl}"
                alt="${escapeHtml(item.name)}"
                loading="lazy"
              >

            </div>

          `;

        }
      ).join("");


  } catch (err) {

    console.error(
      "Gallery error:",
      err
    );


    gallery.innerHTML = `

      <div class="gallery-empty">
        Nie udało się załadować galerii.
      </div>

    `;
  }
}


/*
 * ============================================================
 * LIGHTBOX
 * ============================================================
 */

function openLightbox(
  url,
  name
) {

  lightboxImage.src =
    url;

  lightboxImage.alt =
    name || "";

  lightbox.classList.add(
    "show"
  );
}


function closeLightbox() {

  lightbox.classList.remove(
    "show"
  );

  lightboxImage.src =
    "";
}


lightbox.addEventListener(
  "click",
  function(e) {

    if (
      e.target === lightbox ||
      e.target === lightboxClose
    ) {

      closeLightbox();
    }

  }
);


document.addEventListener(
  "keydown",
  function(e) {

    if (
      e.key === "Escape"
    ) {

      closeLightbox();
    }

  }
);


/*
 * ============================================================
 * START
 * ============================================================
 */

loadGallery();

</script>

</body>
</html>
