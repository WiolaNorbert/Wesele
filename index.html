<!doctype html>
<html lang="pl">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<meta
  name="theme-color"
  content="#f5eee8"
>

<title>Wiola & Norbert</title>

<link
  rel="preconnect"
  href="https://fonts.googleapis.com"
>

<link
  rel="preconnect"
  href="https://fonts.gstatic.com"
  crossorigin
>

<link
  href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@400;500;600&display=swap"
  rel="stylesheet"
>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;

  min-height: 100vh;

  font-family:
    Montserrat,
    Arial,
    sans-serif;

  background:
    linear-gradient(
      180deg,
      #f8f1ec 0%,
      #fffaf7 100%
    );

  color: #463b36;
}

.container {
  width: min(900px, calc(100% - 32px));

  margin: 0 auto;

  padding:
    45px 0
    60px;
}

.hero {
  text-align: center;

  margin-bottom: 35px;
}

.small-title {
  font-size: 12px;

  letter-spacing: 4px;

  text-transform: uppercase;

  color: #8f7d73;

  margin-bottom: 12px;
}

h1 {
  font-family:
    "Cormorant Garamond",
    serif;

  font-size:
    clamp(52px, 10vw, 90px);

  line-height: 0.95;

  font-weight: 500;

  margin: 0;

  color: #59483f;
}

.subtitle {
  margin-top: 18px;

  font-family:
    "Cormorant Garamond",
    serif;

  font-size: 25px;

  color: #806d63;
}

.card {
  background: rgba(255,255,255,0.82);

  border:
    1px solid
    rgba(130,100,80,0.14);

  border-radius: 24px;

  padding: 30px;

  box-shadow:
    0 12px 40px
    rgba(80,55,40,0.08);

  backdrop-filter: blur(8px);

  margin-bottom: 28px;
}

.upload-area {
  text-align: center;

  border:
    2px dashed
    #cdbdb3;

  border-radius: 20px;

  padding: 35px 20px;

  transition:
    background 0.2s,
    border-color 0.2s;
}

.upload-area:hover {
  background: #fffaf7;

  border-color: #ad9588;
}

.upload-icon {
  font-size: 42px;

  margin-bottom: 12px;
}

.upload-title {
  font-family:
    "Cormorant Garamond",
    serif;

  font-size: 30px;

  margin-bottom: 8px;
}

.upload-description {
  font-size: 13px;

  line-height: 1.6;

  color: #8a7a72;

  margin-bottom: 22px;
}

input[type="file"] {
  display: none;
}

.select-button {
  display: inline-block;

  padding:
    13px 24px;

  border-radius: 30px;

  background: #806d63;

  color: white;

  cursor: pointer;

  font-size: 13px;

  font-weight: 600;

  letter-spacing: 0.5px;

  transition:
    transform 0.15s,
    background 0.15s;
}

.select-button:hover {
  background: #69574e;

  transform: translateY(-1px);
}

.files {
  margin-top: 25px;
}

.file {
  padding:
    14px 0;

  border-bottom:
    1px solid
    rgba(100,80,70,0.1);
}

.file:last-child {
  border-bottom: 0;
}

.file-header {
  display: flex;

  justify-content: space-between;

  gap: 15px;

  font-size: 13px;

  margin-bottom: 8px;
}

.file-name {
  overflow: hidden;

  text-overflow: ellipsis;

  white-space: nowrap;
}

.file-status {
  white-space: nowrap;

  color: #8c7970;
}

.progress {
  width: 100%;

  height: 7px;

  background: #eee4de;

  border-radius: 20px;

  overflow: hidden;
}

.progress-bar {
  width: 0%;

  height: 100%;

  background: #9d887c;

  transition:
    width 0.15s linear;
}

.file-details {
  display: flex;

  justify-content: space-between;

  gap: 10px;

  margin-top: 7px;

  font-size: 11px;

  color: #998a82;
}

.total-progress {
  margin-top: 25px;

  padding-top: 20px;

  border-top:
    1px solid
    rgba(100,80,70,0.1);
}

.total-title {
  display: flex;

  justify-content: space-between;

  font-size: 12px;

  margin-bottom: 8px;
}

.message {
  margin-top: 18px;

  text-align: center;

  font-size: 13px;

  line-height: 1.5;
}

.message.success {
  color: #637c66;
}

.message.error {
  color: #a15d57;
}

.gallery-title {
  text-align: center;

  font-family:
    "Cormorant Garamond",
    serif;

  font-size: 38px;

  font-weight: 500;

  margin:
    10px 0 25px;
}

.gallery {
  display: grid;

  grid-template-columns:
    repeat(
      auto-fill,
      minmax(180px, 1fr)
    );

  gap: 14px;
}

.gallery-item {
  position: relative;

  overflow: hidden;

  border-radius: 15px;

  background: #eee5df;

  aspect-ratio: 1 / 1;
}

.gallery-item img {
  width: 100%;

  height: 100%;

  display: block;

  object-fit: cover;
}

.gallery-empty {
  text-align: center;

  color: #97877f;

  font-size: 13px;

  padding: 25px;
}

.footer {
  text-align: center;

  margin-top: 35px;

  font-family:
    "Cormorant Garamond",
    serif;

  font-size: 19px;

  color: #96857b;
}

@media (max-width: 600px) {

  .container {
    width:
      calc(100% - 20px);

    padding-top: 30px;
  }

  .card {
    padding: 20px;

    border-radius: 18px;
  }

  .upload-area {
    padding:
      28px 15px;
  }

  .file-header {
    font-size: 12px;
  }

  .gallery {
    grid-template-columns:
      repeat(2, 1fr);
  }
}

</style>

</head>


<body>

<div class="container">

  <section class="hero">

    <div class="small-title">
      Nasz wielki dzień
    </div>

    <h1>
      Wiola &amp; Norbert
    </h1>

    <div class="subtitle">
      Zapiszmy te wspomnienia razem ♡
    </div>

  </section>


  <section class="card">

    <div class="upload-area">

      <div class="upload-icon">
        📸
      </div>

      <div class="upload-title">
        Podziel się zdjęciami i filmami
      </div>

      <div class="upload-description">

        Dodaj swoje wspomnienia z naszego wesela.<br>

        Zdjęcia i filmy do <strong>50 MB</strong> każdy.

      </div>

      <label
        class="select-button"
        for="fileInput"
      >
        Wybierz zdjęcia lub filmy
      </label>

      <input
        id="fileInput"
        type="file"
        accept="image/*,video/*"
        multiple
      >

    </div>


    <div
      id="files"
      class="files"
    ></div>


    <div
      id="totalProgress"
      class="total-progress"
      style="display:none"
    >

      <div class="total-title">

        <span>
          Łączny postęp
        </span>

        <span id="totalPercent">
          0%
        </span>

      </div>

      <div class="progress">

        <div
          id="totalBar"
          class="progress-bar"
        ></div>

      </div>

    </div>


    <div
      id="message"
      class="message"
    ></div>

  </section>


  <section class="card">

    <div class="gallery-title">
      Najnowsze wspomnienia
    </div>

    <div
      id="gallery"
      class="gallery"
    >
      <div class="gallery-empty">
        Ładowanie zdjęć...
      </div>
    </div>

  </section>


  <div class="footer">
    Dziękujemy, że jesteście z nami ♡
  </div>

</div>


<script>

/*
 * ============================================================
 * KONFIGURACJA
 * ============================================================
 */

const ENDPOINT =
  "https://script.google.com/macros/s/AKfycbwnwoJ95r2lJmI7PYf_2uJWPlgEOEjOl_UdJt-qnuI2YL5-k_l4t-n5kSFwITysDB_K/exec";


const MAX_FILE_SIZE =
  50 * 1024 * 1024;


/*
 * 8 MB.
 *
 * Google Drive resumable upload wymaga rozmiarów
 * będących wielokrotnością 256 KiB.
 */
const CHUNK_SIZE =
  8 * 1024 * 1024;


/*
 * ============================================================
 * ELEMENTY UI
 * ============================================================
 */

const fileInput =
  document.getElementById("fileInput");

const filesContainer =
  document.getElementById("files");

const message =
  document.getElementById("message");

const totalProgress =
  document.getElementById("totalProgress");

const totalBar =
  document.getElementById("totalBar");

const totalPercent =
  document.getElementById("totalPercent");

const gallery =
  document.getElementById("gallery");


/*
 * ============================================================
 * POMOCNICZE
 * ============================================================
 */

function formatBytes(bytes) {

  if (bytes < 1024) {
    return bytes + " B";
  }

  if (bytes < 1024 * 1024) {
    return (
      (bytes / 1024).toFixed(0)
      + " KB"
    );
  }

  return (
    (bytes / 1024 / 1024).toFixed(1)
    + " MB"
  );
}


function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function formatTime(seconds) {

  if (!Number.isFinite(seconds) || seconds < 0) {
    return "";
  }

  seconds = Math.round(seconds);

  if (seconds < 60) {
    return seconds + " s";
  }

  const minutes =
    Math.floor(seconds / 60);

  const secs =
    seconds % 60;

  return (
    minutes +
    " min " +
    String(secs).padStart(2, "0") +
    " s"
  );
}


/*
 * POST do Apps Script.
 *
 * Tutaj przesyłamy wyłącznie małe JSON-y z metadanymi.
 * Nigdy nie wysyłamy przez Apps Script zawartości pliku.
 */
async function callBackend(payload) {

  const response =
    await fetch(
      ENDPOINT,
      {
        method: "POST",

        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body:
          JSON.stringify(payload)
      }
    );

  const text =
    await response.text();

  let data;

  try {
    data = JSON.parse(text);

  } catch (err) {

    throw new Error(
      "Nieprawidłowa odpowiedź serwera: " +
      text
    );
  }

  if (!data.ok) {
    throw new Error(
      data.error ||
      "Nieznany błąd serwera."
    );
  }

  return data;
}


/*
 * ============================================================
 * UPLOAD BEZPOŚREDNIO DO GOOGLE DRIVE
 * ============================================================
 */

async function uploadFile(file, ui) {

  if (file.size > MAX_FILE_SIZE) {

    throw new Error(
      "Plik \"" +
      file.name +
      "\" jest za duży. Maksymalny rozmiar to 50 MB."
    );
  }


  /*
   * 1. Prosisz Apps Script wyłącznie o utworzenie
   *    resumable upload session.
   */
  const sessionData =
    await callBackend({

      action: "start",

      name: file.name,

      mimeType:
        file.type ||
        "application/octet-stream",

      size: file.size

    });


  const session =
    sessionData.session;


  if (!session) {

    throw new Error(
      "Brak URL sesji uploadu."
    );
  }


  /*
   * 2. Plik wysyłamy BEZPOŚREDNIO do Google Drive.
   *
   * Nie:
   *
   *   fetch(ENDPOINT)
   *
   * tylko:
   *
   *   fetch(session)
   */
  let offset = 0;

  const startTime =
    performance.now();


  while (offset < file.size) {

    const end =
      Math.min(
        offset + CHUNK_SIZE,
        file.size
      );

    const chunk =
      file.slice(
        offset,
        end
      );

    const chunkSize =
      end - offset;


    const response =
      await fetch(
        session,
        {
          method: "PUT",

          headers: {

            "Content-Range":
              "bytes " +
              offset +
              "-" +
              (end - 1) +
              "/" +
              file.size,

            "Content-Type":
              file.type ||
              "application/octet-stream"
          },

          body: chunk
        }
      );


    /*
     * Google Drive:
     *
     * 308 = chunk przyjęty, upload trwa
     *
     * 200/201 = cały plik zakończony
     */
    if (
      response.status !== 200 &&
      response.status !== 201 &&
      response.status !== 308
    ) {

      let errorText = "";

      try {
        errorText =
          await response.text();

      } catch (err) {
        errorText = "";
      }

      throw new Error(
        "Google Drive upload error " +
        response.status +
        (
          errorText
            ? ": " + errorText
            : ""
        )
      );
    }


    offset = end;


    /*
     * Aktualizacja postępu.
     */
    const elapsed =
      (performance.now() - startTime)
      / 1000;

    const speed =
      elapsed > 0
        ? offset / elapsed
        : 0;

    const remaining =
      file.size - offset;

    const eta =
      speed > 0
        ? remaining / speed
        : 0;

    const percent =
      file.size > 0
        ? (offset / file.size) * 100
        : 100;


    ui.bar.style.width =
      percent.toFixed(1) + "%";


    ui.status.textContent =
      percent >= 100
        ? "gotowe"
        : "wysyłanie";


    ui.details.textContent =
      formatBytes(offset) +
      " / " +
      formatBytes(file.size) +
      "    " +
      formatBytes(speed) +
      "/s" +
      (
        remaining > 0
          ? "    pozostało " +
            formatTime(eta)
          : ""
      );


    /*
     * Aktualizujemy łączny postęp.
     */
    updateTotalProgress();
  }


  /*
   * Gwarantujemy 100%.
   */
  ui.bar.style.width = "100%";

  ui.status.textContent =
    "gotowe";

  ui.details.textContent =
    formatBytes(file.size) +
    " / " +
    formatBytes(file.size);


  updateTotalProgress();
}


/*
 * ============================================================
 * UI PLIKU
 * ============================================================
 */

function createFileUI(file) {

  const wrapper =
    document.createElement("div");

  wrapper.className =
    "file";


  wrapper.innerHTML = `

    <div class="file-header">

      <span class="file-name">
        ${escapeHtml(file.name)}
      </span>

      <span class="file-status">
        oczekiwanie
      </span>

    </div>

    <div class="progress">

      <div
        class="progress-bar"
        style="width:0%"
      ></div>

    </div>

    <div class="file-details">
      0 KB / ${formatBytes(file.size)}
    </div>

  `;


  filesContainer.appendChild(
    wrapper
  );


  return {

    wrapper: wrapper,

    bar:
      wrapper.querySelector(
        ".progress-bar"
      ),

    status:
      wrapper.querySelector(
        ".file-status"
      ),

    details:
      wrapper.querySelector(
        ".file-details"
      )
  };
}


/*
 * ============================================================
 * ŁĄCZNY POSTĘP
 * ============================================================
 */

let currentFiles = [];


function updateTotalProgress() {

  if (!currentFiles.length) {
    return;
  }


  let uploaded = 0;

  let total = 0;


  for (
    const item
    of currentFiles
  ) {

    total += item.file.size;

    uploaded += item.uploaded || 0;
  }


  const percent =
    total > 0
      ? (uploaded / total) * 100
      : 0;


  totalBar.style.width =
    percent.toFixed(1) + "%";

  totalPercent.textContent =
    Math.round(percent) + "%";
}


/*
 * ============================================================
 * WYBÓR PLIKÓW
 * ============================================================
 */

fileInput.addEventListener(
  "change",
  async function() {

    const selected =
      Array.from(
        fileInput.files || []
      );


    if (!selected.length) {
      return;
    }


    filesContainer.innerHTML = "";

    message.textContent = "";

    message.className =
      "message";


    currentFiles =
      selected.map(function(file) {

        return {
          file: file,
          uploaded: 0,
          ui: null
        };

      });


    totalProgress.style.display =
      "block";


    for (
      const item
      of currentFiles
    ) {

      item.ui =
        createFileUI(
          item.file
        );
    }


    updateTotalProgress();


    /*
     * Wysyłamy sekwencyjnie.
     *
     * To ogranicza równoległe obciążenie
     * przeglądarki i Google Drive.
     */
    try {

      for (
        const item
        of currentFiles
      ) {

        item.ui.status.textContent =
          "przygotowanie";


        await uploadFile(
          item.file,
          {

            bar:
              item.ui.bar,

            status:
              item.ui.status,

            details:
              item.ui.details

          }
        );


        item.uploaded =
          item.file.size;


        updateTotalProgress();
      }


      message.textContent =
        "Wszystkie pliki zostały przesłane. Dziękujemy! ♡";

      message.className =
        "message success";


      /*
       * Odświeżamy galerię po zakończeniu uploadu.
       */
      await loadGallery();


    } catch (err) {

      console.error(err);


      message.textContent =
        "Wystąpił błąd: " +
        (
          err &&
          err.message
            ? err.message
            : err
        );

      message.className =
        "message error";
    }

  }
);


/*
 * ============================================================
 * GALERIA
 * ============================================================
 */

async function loadGallery() {

  try {

    const response =
      await fetch(
        ENDPOINT +
        "?action=gallery"
      );


    const data =
      await response.json();


    if (!data.ok) {
      throw new Error(
        data.error ||
        "Nie udało się pobrać galerii."
      );
    }


    const items =
      data.items || [];


    if (!items.length) {

      gallery.innerHTML = `
        <div class="gallery-empty">
          Zdjęcia pojawią się tutaj po przesłaniu.
        </div>
      `;

      return;
    }


    gallery.innerHTML =
      items.map(function(item) {

        return `

          <div class="gallery-item">

            <img
              src="https://drive.google.com/thumbnail?id=${encodeURIComponent(item.id)}&sz=w1000"
              alt="${escapeHtml(item.name)}"
              loading="lazy"
            >

          </div>

        `;

      }).join("");


  } catch (err) {

    console.error(
      "Gallery error:",
      err
    );


    gallery.innerHTML = `
      <div class="gallery-empty">
        Nie udało się załadować galerii.
      </div>
    `;
  }
}


/*
 * ============================================================
 * START
 * ============================================================
 */

loadGallery();

</script>

</body>

</html>
